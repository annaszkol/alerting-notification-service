# One origin for the browser: static UI, REST API under /api, WebSocket under /ws (contracts/ws-messages.md).
server {
    listen 3000;
    root /usr/share/nginx/html;

    # Docker's DNS, resolved per request: nginx starts even if the API container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        return 200 "ok\n";
    }

    # Client-side routes (/alerts/42, /a/42) all load the SPA.
    location / {
        try_files $uri /index.html;
    }
}
