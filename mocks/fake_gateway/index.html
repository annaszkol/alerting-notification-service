<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake SMS / phone gateway</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
          --red: #c62828; --green: #2e7d32; --blue: #1f5fbf; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px;
           background: var(--card); border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 auto 0 0; }
  .toggle { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--card); cursor: pointer; }
  .toggle.down { background: var(--red); color: #fff; border-color: var(--red); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; padding: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  h2 { font-size: 14px; margin: 0 0 8px; }
  .msg { border-top: 1px solid var(--line); padding: 8px 0; }
  .msg:first-of-type { border-top: 0; }
  .meta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .text { white-space: pre-wrap; word-break: break-word; margin: 4px 0; }
  .in { color: var(--blue); }
  .ok { color: var(--green); }
  button.small { font-size: 12px; padding: 2px 8px; cursor: pointer; }
  form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; flex: 1 1 140px; }
</style>
</head>
<body>
<header>
  <h1>Fake SMS / phone gateway</h1>
  <button class="toggle" id="out-sms" onclick="toggle('sms')">SMS: up</button>
  <button class="toggle" id="out-phone" onclick="toggle('phone')">Phone: up</button>
  <button class="toggle" onclick="clearAll()">Clear</button>
</header>
<main>
  <section>
    <h2>SMS</h2>
    <form onsubmit="reply(event)">
      <input id="from" placeholder="from, e.g. +48500100200" required>
      <input id="text" placeholder="ACK K7Q2MX / APPROVE … / REJECT …" required>
      <button>Reply</button>
    </form>
    <div id="sms"></div>
  </section>
  <section>
    <h2>Phone calls</h2>
    <div id="phone"></div>
  </section>
</main>
<script>
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const time = iso => new Date(iso).toLocaleTimeString();
  let outage = {sms: false, phone: false};

  function render(messages) {
    const sms = messages.filter(m => m.channel === "sms").reverse();
    const calls = messages.filter(m => m.channel === "phone").reverse();
    document.getElementById("sms").innerHTML = sms.map(m => m.direction === "in"
      ? `<div class="msg in"><div class="meta"><span>${time(m.receivedAt)}</span><span>from ${esc(m.from)}</span>
           <span>${m.result ? "→ " + esc(m.result) : ""}</span></div><div class="text">${esc(m.text)}</div></div>`
      : `<div class="msg"><div class="meta"><span>${time(m.receivedAt)}</span><span>to ${esc(m.to)}</span>
           ${m.duplicates ? `<span>duplicates: ${m.duplicates}</span>` : ""}</div><div class="text">${esc(m.text)}</div></div>`
    ).join("") || "<p class='meta'>No messages yet.</p>";
    document.getElementById("phone").innerHTML = calls.map(m =>
      `<div class="msg"><div class="meta"><span>${time(m.receivedAt)}</span><span>to ${esc(m.to)}</span></div>
         <div class="text">${esc(m.text)}</div>
         ${m.pressed1 ? `<span class="ok">pressed 1 → ${esc(m.pressed1)}</span>`
           : m.replyCode ? `<button class="small" onclick="press1(${m.id})">Press 1</button>` : ""}</div>`
    ).join("") || "<p class='meta'>No calls yet.</p>";
  }

  function renderOutage() {
    for (const ch of ["sms", "phone"]) {
      const b = document.getElementById("out-" + ch);
      b.textContent = `${ch === "sms" ? "SMS" : "Phone"}: ${outage[ch] ? "OUTAGE" : "up"}`;
      b.classList.toggle("down", outage[ch]);
    }
  }

  async function refresh() {
    try {
      const [m, o] = await Promise.all([fetch("api/messages"), fetch("api/outage")]);
      render(await m.json()); outage = await o.json(); renderOutage();
    } catch (e) { /* gateway restarting */ }
  }

  async function toggle(ch) {
    const r = await fetch("api/outage", {method: "POST", headers: {"content-type": "application/json"},
                                         body: JSON.stringify({[ch]: !outage[ch]})});
    outage = await r.json(); renderOutage();
  }

  async function reply(ev) {
    ev.preventDefault();
    await fetch("api/reply", {method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({from: document.getElementById("from").value, text: document.getElementById("text").value})});
    document.getElementById("text").value = "";
    refresh();
  }

  async function press1(id) { await fetch(`api/calls/${id}/press1`, {method: "POST"}); refresh(); }
  async function clearAll() { await fetch("api/messages", {method: "DELETE"}); refresh(); }

  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
