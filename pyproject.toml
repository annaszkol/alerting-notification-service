[project]
name = "alerting-notification-service"
version = "0.1.0"
description = "Flexible Alerting & Notification Service (Hackathon 2026)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "pyjwt>=2.9",
    "psycopg-pool>=3.2",
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.23",
]

[tool.uv]
# Not an installable package: services run as `python -m services.<name>` from the repo root.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
testpaths = ["contracts", "db", "deploy", "libs", "services", "mocks", "tests"]
markers = [
    "db: needs a Postgres database (TEST_DATABASE_URL); skipped when it is not set",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
